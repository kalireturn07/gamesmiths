<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamesmiths · BEC Digital Arts Club</title>
    <meta
      name="description"
      content="Gamesmiths is the BEC Digital Arts Club at Basaveshwar Engineering College, Bagalkot: competitive gaming, game development, and digital art under one forge."
    />
    <meta name="theme-color" content="#1C1B19" />
    <meta name="color-scheme" content="dark light" />

    <!-- Favicons: generated from the placeholder logo mark. Regenerate them when the
         official logo is added (see README → "Swapping in the real logo"). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gamesmiths" />
    <meta property="og:title" content="Gamesmiths · BEC Digital Arts Club" />
    <meta
      property="og:description"
      content="Every legend starts as a blank canvas — or an unranked noob. Let's forge yours."
    />
    <meta name="twitter:card" content="summary" />
    <!-- TODO(launch): once the site has a public URL, add absolute og:url / og:image tags
         (social previews need full URLs), e.g.
         <meta property="og:url" content="https://your-domain.example/" />
         <meta property="og:image" content="https://your-domain.example/icon-512.png" /> -->
    <!-- Without JavaScript, show everything that would otherwise animate in. -->
    <noscript>
      <style>
        [data-anim] {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
          clip-path: none !important;
        }
        [data-anim] path,
        path[data-anim] {
          stroke-dasharray: none !important;
          stroke-dashoffset: 0 !important;
        }
        .nojs-hide {
          display: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
